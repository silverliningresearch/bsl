<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSL - Marketing Survey</title>
	<link rel="icon" type="image/x-icon" href="images/favicon.ico">
 
    <link rel="stylesheet" type="text/css" href="https://files.survalyzer.eu/public/dependency/fontawesome-free/v5/css/all.min.css" />
    <link rel="stylesheet" type="text/css" href="https://files.survalyzer.eu/public/dependency/devextreme/latest/css/dx.light.css" />
    <link rel="stylesheet" type="text/css" href="https://files.survalyzer.eu/public/dependency/styleguide/latest/assets/default/rt-theme.min.css" />


    <link href="css/map-search-box.css" rel ="stylesheet" type="text/css" />
    <link href="css/postal-code-search-box.css" rel ="stylesheet" type="text/css" />
  </head>

  <body>
    <survalyzer-survey
      surveyhash="rxewbtdvgw"
      tenant="silverlining"
    ></survalyzer-survey>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://files.survalyzer.eu/public/dependency/jquery/latest/jquery.min.js"></script>
    <script src="https://files.survalyzer.eu/public/dependency/bootstrap/v4/js/bootstrap.bundle.min.js"></script>
    <script src="https://files.survalyzer.eu/public/dependency/embedded/release/survalyzer-survey.js"></script>

    <script src="data/Departures_flight_list.js"></script>

    <script src="scripts/flight_search.js"></script>
    <script src="scripts/maps_search.js"></script>
    
    <div id="selectedAddress"></div>
    <input
      id="pac-input"
      class="controls"
      type="text"
      placeholder="Search Box"
    />

    <div id="map">
      <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyvj3Xxekjs1ZGpv5mtwkblHhmjdPd2SA&callback=initAutocomplete&libraries=places&v=weekly"
        defer> 
      </script>
    </div>

    <script>
        window.addEventListener('load', function () {

        setTimeout(() => {
          const googleMapsHandler = () => {
            console.log("Current Page Index: ", api.fn.getCurrentPageIndex() );

            if (api.fn.getCurrentPageIndex() === 1) { //Flight departure
              showFlightCodeSection() ;
            } else {
              hideFlightCodeSection();
            }

            switch(api.fn.getCurrentPageIndex() ) {
              case 999: 
                showGoogleMaps("Q27");
                break;

              default:
                hideGoogleMaps();
                break;
            }

          };

          api.events.subscribe('next', googleMapsHandler);
          api.events.subscribe('back', googleMapsHandler);
          api.events.subscribe('startedOrContinued', googleMapsHandler);
        });
      });
    </script>
</body>
</html>
